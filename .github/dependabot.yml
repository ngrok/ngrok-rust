version: 2
updates:
  - package-ecosystem: "github-actions"
    directories:
      - "/"                                # .github/workflows
      - "/.github/actions/nix-dev-env"     # local composite actions
      - "/.github/actions/rust-cache"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 3
    groups:
      github-actions:
        patterns: ["*"]
